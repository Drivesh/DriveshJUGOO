<style>
:root{--navy:#0b1f3a;--navy-d:#071528;--navy-l:#1e4378;--gold:#c9a24b;--gold-l:#d8b766;--cream:#f6eedb;--ink:#18202c;--soft:#4a5566;--line:#e4e0d6;--paper:#fbfaf6;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:var(--navy-l)}a:hover{color:var(--gold)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h3{font-size:1.05rem;font-weight:600}p{margin:0 0 .9em}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.serif{font-family:var(--serif);font-weight:700}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:600;color:var(--gold);margin-bottom:.5rem}
.muted{color:var(--soft)}.small{font-size:.86rem}
.btn{display:inline-block;padding:.72rem 1.3rem;border-radius:999px;font-weight:600;font-size:.92rem;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--navy-d)}.btn-gold:hover{background:var(--gold-l);color:var(--navy-d)}
.btn-line{color:#fff;border-color:rgba(255,255,255,.4)}.btn-line:hover{color:var(--gold-l);border-color:var(--gold-l)}
.btn-small{padding:.45rem .9rem;font-size:.82rem}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(7,21,40,.93);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,162,75,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{color:#fff;text-decoration:none;font-size:1.25rem;display:flex;gap:.55rem;align-items:center}.brand:hover{color:#fff}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy-d);font:700 .9rem var(--serif)}
nav{display:flex;gap:1.2rem}nav a{color:rgba(255,255,255,.82);text-decoration:none;font-size:.87rem}nav a:hover{color:var(--gold-l)}
.menu{display:none;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:.3rem .7rem;font-size:1.1rem;cursor:pointer}
/* hero */
.hero{background:radial-gradient(1000px 500px at 85% -10%,rgba(201,162,75,.18),transparent 60%),linear-gradient(160deg,var(--navy-d),var(--navy) 55%,#13305a);color:#fff;padding:clamp(3rem,8vw,6rem) 0}
.hero-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.hero h1{font-size:clamp(2.8rem,7vw,4.8rem);font-family:var(--serif)}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.4vw,1.65rem);color:var(--gold-l);line-height:1.35}
.intro{color:rgba(255,255,255,.82);max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}
.frame{border-radius:22px;padding:10px;background:linear-gradient(145deg,var(--gold-l),rgba(201,162,75,.15));box-shadow:0 30px 60px -25px rgba(0,0,0,.6);max-width:400px;margin-inline:auto}
.frame img{border-radius:16px;width:100%;aspect-ratio:3/4;object-fit:cover;background:#13305a}
/* sections */
section.s{padding:clamp(3.2rem,7vw,5.5rem) 0;border-top:1px solid var(--line)}
section.dark{background:var(--navy);color:#fff;border:0}
.s h2{font-family:var(--serif);font-size:clamp(2rem,4vw,2.7rem);color:var(--navy);margin-bottom:1.8rem}.dark h2{color:#fff}
.about p{font-size:1.04rem;color:var(--soft)}.about{columns:2 320px;column-gap:3rem}.about p{break-inside:avoid}
.grid{display:grid;gap:1.3rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.4rem}
.job{display:grid;grid-template-columns:160px 1fr;gap:2rem;margin-bottom:1.3rem}
.job .dates{font-weight:600;color:var(--navy-l);font-size:.9rem;padding-top:1.3rem;text-align:right}
ul.ticks{list-style:none;padding:0;margin:.5rem 0 0}ul.ticks li{position:relative;padding-left:1.4rem;margin-bottom:.3rem;color:var(--soft)}
ul.ticks li::before{content:'';position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.ach{border-top:2px solid var(--gold);padding-top:1.1rem}.ach p{color:rgba(255,255,255,.78)}
.metric{font:700 2.5rem/1 var(--serif);color:var(--gold-l);margin-bottom:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 .8rem}.chip{font-size:.74rem;background:var(--cream);color:var(--navy);padding:.2rem .6rem;border-radius:999px}
.group h3{font:700 1.4rem var(--serif);color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.9rem}
.skill{margin-bottom:.9rem;font-size:.93rem;font-weight:500}
.meter{height:6px;background:#eeeae0;border-radius:99px;overflow:hidden;margin-top:.3rem}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--navy-l),var(--gold))}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem}
.gallery figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--navy)}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery figcaption{position:absolute;inset:auto 0 0;padding:1.3rem .8rem .55rem;color:#fff;font-size:.84rem;background:linear-gradient(transparent,rgba(7,21,40,.85))}
.doc{display:flex;align-items:center;gap:1.1rem;margin-bottom:.8rem}
.doc .ic{flex:none;width:52px;height:62px;border-radius:8px;background:var(--navy);color:var(--gold-l);display:grid;place-items:center;font-size:.68rem;font-weight:700;text-transform:uppercase}
.doc div{flex:1}.doc h3{margin:0}.doc p{margin:0}
.contact{display:flex;flex-wrap:wrap;gap:2.5rem}
.contact div{min-width:200px}.contact span{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l)}
.contact a{color:#fff;text-decoration:none;font-size:1.05rem;font-weight:500}.contact a:hover{color:var(--gold-l)}
footer{background:var(--navy-d);color:rgba(255,255,255,.55);font-size:.85rem;padding:1.5rem 0;text-align:center}
.error{max-width:640px;margin:4rem auto;padding:1.5rem;background:#fdecea;color:#b42318;border-radius:12px;font-family:var(--sans)}
@media(max-width:900px){
 .menu{display:block}
 nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--navy-d);padding:.4rem 16px 1rem}
 nav.open{display:flex}nav a{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.07)}
 .hero-grid{grid-template-columns:1fr}.hero-photo{order:-1;width:min(240px,70%);margin-inline:auto}
 .job{grid-template-columns:1fr;gap:.3rem}.job .dates{text-align:left;padding:0}
}
@media print{header,.actions{display:none}.hero,section.dark{background:none;color:var(--ink)}}
</style>

(function () {
  var C = window.CONTENT;
  var main = document.getElementById('top');
  if (!C) {
    main.innerHTML = '<div class="error"><strong>The page content could not be loaded.</strong><br>' +
      'There is probably a typing error between the ▼ START and ▲ END lines of <code>index.html</code> (a missing comma, quote or bracket). ' +
      'On GitHub open index.html → History, compare with the previous version and fix the last change.</div>';
    return;
  }

  // ---- tiny helpers (all text is inserted as plain text, never as HTML) ----
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function has(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }
  function list(v) { return Array.isArray(v) ? v.filter(Boolean) : []; }
  function url(u) { // allow relative files, https, mailto, tel only
    if (!has(u)) return null;
    u = String(u).trim();
    if (/^(https?:|mailto:|tel:|blob:|data:image\/)/i.test(u)) return u;  // blob:/data: are used by the editor preview
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return null;
    return u.split('/').map(encodeURIComponent).join('/');
  }
  function paras(text, cls) {
    if (!has(text)) return null;
    return el('div', { class: cls || '' }, String(text).split(/\n\s*\n/).map(function (p) { return el('p', { text: p.trim() }); }));
  }
  function ext(f) { var m = /\.([a-z0-9]+)$/i.exec(f || ''); return m ? m[1].toUpperCase() : 'FILE'; }
  var nav = document.querySelector('nav');
  function section(id, label, title, body, dark) {
    nav.appendChild(el('a', { href: '#' + id, text: label }));
    main.appendChild(el('section', { id: id, class: 's' + (dark ? ' dark' : '') }, [
      el('div', { class: 'wrap' }, [el('h2', { text: title }), body])
    ]));
  }

  document.title = C.name + (has(C.headline) ? ' — ' + C.headline : '');
  document.getElementById('brand-name').textContent = C.name;

  // ---- hero ----
  var actions = el('div', { class: 'actions' });
  if (url(C.cv)) actions.appendChild(el('a', { class: 'btn btn-gold', href: url(C.cv), download: '', text: 'Download CV' }));
  actions.appendChild(el('a', { class: 'btn btn-line', href: '#contact', text: 'Get in touch' }));
  if (url(C.linkedin)) actions.appendChild(el('a', { class: 'btn btn-line', href: url(C.linkedin), target: '_blank', rel: 'noopener', text: 'LinkedIn ↗' }));
  main.appendChild(el('section', { class: 'hero' }, [el('div', { class: 'wrap hero-grid' }, [
    el('div', {}, [
      el('p', { class: 'eyebrow', text: [C.headline, C.location].filter(has).join(' · ') }),
      el('h1', { text: C.name }),
      has(C.tagline) ? el('p', { class: 'tagline', text: C.tagline }) : null,
      has(C.intro) ? el('p', { class: 'intro', text: C.intro }) : null,
      actions
    ]),
    has(C.photo) ? el('div', { class: 'hero-photo' }, [el('div', { class: 'frame' }, [el('img', { src: url(C.photo), alt: 'Portrait of ' + C.name, width: 400, height: 533, onerror: "this.onerror=null;this.src=DEFAULT_PHOTO" })])]) : null
  ])]));

  // ---- about ----
  if (has(C.about)) section('about', 'About', 'About me', paras(C.about, 'about'));

  // ---- experience ----
  var jobs = list(C.experience);
  if (jobs.length) section('experience', 'Experience', 'Career history', el('div', {}, jobs.map(function (j) {
    return el('div', { class: 'job' }, [
      el('div', { class: 'dates', text: j.dates || '' }),
      el('div', { class: 'card' }, [
        el('h3', { text: j.role || '' }),
        has(j.company) ? el('p', { class: 'muted', text: j.company }) : null,
        paras(j.summary),
        list(j.points).length ? el('ul', { class: 'ticks' }, list(j.points).map(function (p) { return el('li', { text: p }); })) : null
      ])
    ]);
  })));

  // ---- achievements ----
  var ach = list(C.achievements);
  if (ach.length) section('achievements', 'Achievements', 'Professional achievements', el('div', { class: 'grid' }, ach.map(function (a) {
    return el('div', { class: 'ach' }, [has(a.metric) ? el('div', { class: 'metric', text: a.metric }) : null, el('h3', { text: a.title || '' }), paras(a.text)]);
  })), true);

  // ---- projects ----
  var proj = list(C.projects);
  if (proj.length) section('projects', 'Projects', 'Projects & case studies', el('div', { class: 'grid' }, proj.map(function (p) {
    return el('div', { class: 'card' }, [
      has(p.category) ? el('p', { class: 'eyebrow', text: p.category }) : null,
      el('h3', { text: p.title || '' }),
      paras(p.summary, 'muted'),
      has(p.tools) ? el('div', { class: 'chips' }, String(p.tools).split(',').filter(has).map(function (t) { return el('span', { class: 'chip', text: t.trim() }); })) : null,
      url(p.file) ? el('a', { class: 'btn btn-gold btn-small', href: url(p.file), target: '_blank', rel: 'noopener', text: 'View document' }) : null
    ]);
  })));

  // ---- skills ----
  var skills = list(C.skills), groups = [];
  skills.forEach(function (s) { if (groups.indexOf(s.group || 'Other') < 0) groups.push(s.group || 'Other'); });
  if (skills.length) section('skills', 'Skills', 'Skills & tools', el('div', { class: 'grid' }, groups.map(function (g) {
    return el('div', { class: 'card group' }, [el('h3', { text: g })].concat(skills.filter(function (s) { return (s.group || 'Other') === g; }).map(function (s) {
      var lvl = Math.max(1, Math.min(5, Number(s.level) || 4));
      return el('div', { class: 'skill' }, [s.name || '', el('div', { class: 'meter', 'aria-label': 'Level ' + lvl + ' of 5' }, [el('span', { style: 'width:' + lvl * 20 + '%' })])]);
    })));
  })));

  // ---- education ----
  var edu = list(C.education);
  if (edu.length) section('education', 'Education', 'Education, training & certifications', el('div', { class: 'grid' }, edu.map(function (e) {
    return el('div', { class: 'card' }, [
      el('p', { class: 'eyebrow', text: [e.type, e.year].filter(has).join(' · ') }),
      el('h3', { text: e.title || '' }),
      has(e.school) ? el('p', { class: 'muted', text: e.school }) : null,
      url(e.link) ? el('a', { href: url(e.link), target: '_blank', rel: 'noopener', text: 'View credential ↗' }) : null
    ]);
  })));

  // ---- gallery ----
  var pics = list(C.gallery).filter(function (g) { return url(g.file); });
  if (pics.length) section('gallery', 'Gallery', 'Photo gallery', el('div', { class: 'gallery' }, pics.map(function (g) {
    return el('figure', {}, [el('a', { href: url(g.file), target: '_blank', rel: 'noopener' }, [el('img', { src: url(g.file), alt: g.caption || 'Photo', loading: 'lazy' })]), has(g.caption) ? el('figcaption', { text: g.caption }) : null]);
  })));

  // ---- downloads ----
  var docs = list(C.downloads).filter(function (d) { return url(d.file); });
  if (docs.length) section('downloads', 'Downloads', 'CV & documents', el('div', {}, docs.map(function (d) {
    return el('div', { class: 'card doc' }, [
      el('span', { class: 'ic', text: ext(d.file) }),
      el('div', {}, [el('h3', { text: d.title || d.file }), has(d.description) ? el('p', { class: 'muted small', text: d.description }) : null]),
      el('a', { class: 'btn btn-gold btn-small', href: url(d.file), download: '', text: 'Download' })
    ]);
  })));

  // ---- contact ----
  var ct = el('div', { class: 'contact' });
  if (has(C.email)) ct.appendChild(el('div', {}, [el('span', { text: 'E-mail' }), el('a', { href: 'mailto:' + C.email.trim(), text: C.email })]));
  if (has(C.phone)) ct.appendChild(el('div', {}, [el('span', { text: 'Phone' }), el('a', { href: 'tel:' + C.phone.replace(/\s+/g, ''), text: C.phone })]));
  if (url(C.linkedin)) ct.appendChild(el('div', {}, [el('span', { text: 'LinkedIn' }), el('a', { href: url(C.linkedin), target: '_blank', rel: 'noopener', text: 'View profile ↗' })]));
  if (has(C.location)) ct.appendChild(el('div', {}, [el('span', { text: 'Location' }), el('a', { text: C.location })]));
  section('contact', 'Contact', 'Let’s connect', el('div', {}, [
    el('p', { class: 'intro', text: 'Open to conversations about HR leadership, workforce planning and digital HR in hospitality.' }), ct
  ]), true);

  var foot = document.getElementById('foot');
  foot.appendChild(document.createTextNode('© ' + new Date().getFullYear() + ' ' + C.name + ' · '));
  foot.appendChild(el('a', { href: 'edit.html', text: 'Edit', style: 'color:rgba(255,255,255,.35);text-decoration:none' }));

  // ---- mobile menu ----
  var btn = document.querySelector('.menu');
  btn.addEventListener('click', function () { var o = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', o); });
  nav.addEventListener('click', function () { nav.classList.remove('open'); btn.setAttribute('aria-expanded', false); });
})();
</script>
</body>
</html>
